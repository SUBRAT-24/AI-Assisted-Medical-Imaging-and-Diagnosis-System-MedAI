# DVC Tracked Hyperparameters & Pipeline Configuration (AIML-02)
dataset:
  classification_name: "NIH-ChestX-ray14 / CheXpert-v1.0"
  segmentation_name: "Medical-Segmentation-Decathlon (Task01_BrainTumour & Task06_Lung)"
  dicom_window_presets:
    lung: { ww: 1500, wl: -600 }
    mediastinum: { ww: 350, wl: 50 }
    brain_flair: { ww: 220, wl: 90 }
    bone: { ww: 2000, wl: 400 }

preprocess:
  xray_image_size: [224, 224]
  ct_mri_patch_size: [128, 128, 64]
  voxel_spacing: [1.0, 1.0, 1.5]
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std: [0.229, 0.224, 0.225]
  hu_clip_range: [-1000.0, 400.0]
  augmentation:
    rand_rotate_deg: 15.0
    rand_flip_prob: 0.5
    rand_gaussian_noise_prob: 0.25
    rand_intensity_shift: 0.10

classification:
  backbone: "densenet121"
  alternate_backbone: "efficientnet_b4"
  pretrained: true
  num_classes: 14
  learning_rate: 0.0001
  weight_decay: 0.00001
  batch_size: 32
  epochs: 30
  target_gradcam_layer: "features.norm5"

segmentation:
  architecture: "MONAI_3D_UNet"
  spatial_dims: 3
  in_channels: 1
  out_channels: 3
  channels: [16, 32, 64, 128, 256]
  strides: [2, 2, 2, 2]
  num_res_units: 2
  loss: "DiceCELoss"
  sliding_window_overlap: 0.5
  learning_rate: 0.0003
  epochs: 100
